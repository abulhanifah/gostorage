# Local MinIO for development, demos and tests.
#
#   docker compose up -d     # start MinIO and create the example bucket
#   docker compose down      # stop (data stays in the minio_data volume)
#   docker compose down -v   # stop and wipe data
#
# Endpoints:
#   - S3 API:  http://localhost:9000
#   - Console: http://localhost:9001   (minioadmin / minioadmin)
#
# The one-shot `createbuckets` service waits for MinIO to become healthy and
# then creates the `chum-bucket` bucket used by the examples in
# example_test.go and the README.

services:
  minio:
    image: quay.io/minio/minio:latest
    container_name: gostorage-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # web console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  createbuckets:
    image: minio/mc:latest
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      # Lets `mc` use the alias `local` without an explicit alias-set call.
      MC_HOST_local: http://minioadmin:minioadmin@minio:9000
    entrypoint: ["/bin/sh", "-c", "mc mb --ignore-existing local/chum-bucket"]

volumes:
  minio_data: